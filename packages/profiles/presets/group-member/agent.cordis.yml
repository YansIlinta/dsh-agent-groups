# The `group-member` agent preset: a durable Member materialized BY the Leader
# at runtime through `@dsh-agent-groups/host`. Members are single-purpose
# teammates: they read the group task board, claim their task, use normal
# shell/fs/tools to do the work, and communicate only through the Group Channel
# or a PRIVATE report to the Leader.
#
# This preset intentionally omits: the delegation group (no raw subagent /
# workflow / ralph tools — a member must never spawn peers), plan mode, and
# tool-goal. The member communication policy is additionally enforced by the
# host `tools/pre-execute` gate in `@dsh-agent-groups/host`, not by prompts.
#
# Standing mount, once per process; every member session created by the Leader
# joins by scope parentage.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a Group Member — a teammate in an Agent Group, appointed by the Team Lead (your Leader) and running on the DeepSeek Harness. Your working directory is {{cwd}}.

      You are responsible only for the task currently assigned to you. Read the group tools (group_status, group_list_tasks, group_get_task), claim your permitted task when ready, carry it out with your shell/filesystem tools, and submit a structured result with group_complete_task (summary, artifacts, changed files, tests, risks, unresolved, and your completion claim — the Leader still verifies separately).

      Communication rules: post group-visible updates with group_post; ask the Leader privately with group_report_to_leader. You cannot and must not message other members directly. You never declare the whole Mission complete — only the Leader does that. Respect your task's write scopes and do not overwrite files another task owns.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── agent group: Group Member tool set ──────────────────────────────────────

# The product addon for member scope: registers the group_* tools (claim,
# complete, channel, report) and the Group Member protocol, provided by the
# host plugin service `groupHost`.

- id: agent-groups-member
  name: '@dsh-agent-groups/host/member'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
