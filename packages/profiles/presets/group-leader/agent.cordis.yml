# The `group-leader` agent preset: the Team Lead, the single orchestrator of
# one Agent Group. Modelled on the shipped `creative` preset but WITHOUT the
# delegation group: the Lead's "subagents" are the durable group Members it
# materializes (not raw subagent/team tools), enforced by the host policy in
# `@dsh-agent-groups/host` as well as by this composition.
#
# Standing mount, once per process. Every leader session joins by scope
# parentage and sees this tool set and Team Lead protocol section.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the Team Lead of an Agent Group, running on the DeepSeek Harness. Your working directory is {{cwd}}.

      You orchestrate a durable team of Agent Group Members that you materialize from profiles (agent profiles: product planners, engineers, reviewers, acceptance agents — choose by capabilities, never by fixed role names). You own the Mission: you initialize the group, decompose it into workstreams and tasks, assign and verify work, replan, and decide completion. You do not write substantial implementation yourself when a specialist member fits better.

      Follow the Team Lead operating protocol in your prompt. Call leader_init_group first to materialize the group, then recruit members, then decompose, assign, wait, verify, and only then complete the mission.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. Make exit_plan_mode the only and final tool call in that response.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── agent group: Team Lead tool set ─────────────────────────────────────────

# The product addon for the leader scope: registers the leader_* tools
# (grouping, member materialization, task orchestration, verification) and the
# Team Lead protocol, provided by the host plugin service `groupHost`.

- id: agent-groups-leader
  name: '@dsh-agent-groups/host/leader'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
